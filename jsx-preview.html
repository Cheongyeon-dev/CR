<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSX Preview · THREE DAYS OF SUN</title>
  <style>
    body {
      margin: 0;
      padding: 12px;
      background: #fdfbf7;
    }
    #root {
      max-width: 800px;
      margin: 0 auto;
    }
    .preview-error {
      margin: 0;
      color: #8b2942;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="root"><p class="preview-error">로딩 중…</p></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    (async function () {
      var rootEl = document.getElementById("root");
      var JSX_URL =
        new URL("components/MainTerminal.jsx", location.href).href + "?v=20260721i";
      try {
        var res = await fetch(JSX_URL);
        if (!res.ok) throw new Error(JSX_URL + " (" + res.status + ")");
        var source = await res.text();
        var compiled = Babel.transform(source, {
          presets: [["react", { runtime: "classic" }]],
          filename: "MainTerminal.jsx",
        }).code;
        var CustomComponent = new Function(
          "React",
          "ReactDOM",
          compiled + "; return CustomComponent;"
        )(React, ReactDOM);
        if (typeof CustomComponent !== "function") throw new Error("CustomComponent 없음");
        var sample = React.createElement(CustomComponent, {
          type: "main",
          playerName: "파랑",
          voyageDay: "2",
          gender: "여",
          role: "VIP 승객",
          dateTime: "7월 4일 월요일 09:00",
          location: "7F 라운지 바",
          dayPhase: "낮",
          weather: "맑음",
          fogLevel: "없음",
          seaState: "잔잔한 파도",
          seaRegion: "동아시아 해역",
          sanity: 85,
          userOutfit: "검은 원피스, 진주 목걸이",
          userInventory: "객실키, 스마트폰",
          mainNpc: {
            name: "설하영",
            affection: 41,
            mood: "🙂평온",
            action: "칵테일을 흔드는 중",
            outfit: "검은 정장",
            items: "실버 워치",
          },
          nearbyNpcs: [
            {
              name: "레이나",
              affection: 28,
              mood: "🤔고민",
              action: "난간을 바라보는 중",
            },
          ],
          schedule: "19:00 디너쇼 · 22:00 안개 주의",
          diaryNpcName: "설하영",
          diary: "웃었지만, 눈빛은 바다 쪽을 향하고 있었다.",
          inventoryIds: ["log_203"],
          events: [
            {
              location: "7F 라운지 바",
              name: "설하영",
              affection: 41,
              mood: "🙂평온",
              action: "칵테일을 흔드는 중",
            },
            {
              location: "9F 갑판 산책로",
              name: "크리스티안",
              affection: 15,
              mood: "🙂",
              action: "갑판을 순찰하는 중",
            },
            { location: "12F 브릿지 · 선장실", scene: "승객 출입 제한." },
          ],
        });
        ReactDOM.createRoot(rootEl).render(sample);
      } catch (err) {
        rootEl.innerHTML =
          '<p class="preview-error">미리보기 로드 실패: ' +
          String(err && err.message ? err.message : err) +
          "</p>";
      }
    })();
  </script>
</body>
</html>
